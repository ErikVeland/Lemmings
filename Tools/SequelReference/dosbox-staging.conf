# Development reference only. Do not ship this as a native game engine.
[sdl]
fullscreen = false
windowresolution = 960x720

[dosbox]
machine = svga_s3
memsize = 16
automount = false

[cpu]
core = normal
cpu_cycles = 20000
cpu_cycles_protected = 20000

[render]
glshader = none

[capture]
capture_dir = captures
default_image_capture_formats = raw

[mixer]
nosound = true

[mouse]
mouse_capture = seamless
mouse_raw_input = false

[ipx]
ipx = false

[ethernet]
ne2000 = false
