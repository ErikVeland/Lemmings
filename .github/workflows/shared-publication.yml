name: Separate product release contracts

on:
  pull_request:
  push:
    branches: [main, release/ultimate-lemmings, release/ultimate-lemmix]

jobs:
  publication-contract:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Check shared source and release metadata
        run: zsh Scripts/build-publication.sh --check
      - name: Gate interface translations
        run: python3 Tools/Localisation/catalogue.py --release
      - name: Check publication and compiler contracts
        run: python3 -m unittest discover -s Tools/Publication -p 'test_*.py'
      - name: Check shared mobile source contracts
        run: python3 -m unittest discover -s Apps/SharedAppleMobile/Tests -p 'test_*.py'
      - name: Check shared Mac compiler contracts
        run: python3 -m unittest discover -s Tests/ReleaseReadinessTests -p 'test_mac_sources.py'

  product-contract:
    name: ${{ matrix.product }} release contract
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        product: [ultimate-lemmings, ultimate-lemmix]
    steps:
      - uses: actions/checkout@v5
      - name: Check independent product metadata
        run: zsh Scripts/build-publication.sh --check --edition '${{ matrix.product }}'

  website:
    name: Website build and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select website changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          base = os.environ.get("BASE_SHA", "")
          head = os.environ["HEAD_SHA"]
          available = base and set(base) != {"0"} and subprocess.run(
              ["git", "cat-file", "-e", base + "^{commit}"], capture_output=True
          ).returncode == 0
          changed = not available or bool(subprocess.check_output(
              ["git", "diff", "--name-only", base, head, "--", "Website/",
               ".github/workflows/shared-publication.yml"], text=True
          ).strip())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write("website=" + str(changed).lower() + "\n")
          PYTHON
      - name: Build website
        if: steps.changes.outputs.website == 'true'
        run: python3 Website/build.py
      - name: Check website release output
        if: steps.changes.outputs.website == 'true'
        run: python3 Website/check_site.py
