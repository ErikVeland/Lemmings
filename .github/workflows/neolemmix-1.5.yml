name: NeoLemmix 1.5

on:
  pull_request:
  push:
    branches:
      - main
      - codex/1.5

permissions:
  contents: read

concurrency:
  group: neolemmix-${{ github.ref }}
  cancel-in-progress: true

env:
  LEMMINGS_TEST_AUDIO: muted
  LEMMINGS_TEST_WINDOWS: offscreen

jobs:
  source-gate:
    name: Source gate
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out Ultimate Lemmings
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Run the 1.5 source gate
        run: zsh Scripts/check-1.5-neolemmix.sh
