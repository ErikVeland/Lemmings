name: iOS 1.3

on:
  pull_request:
  push:
    branches:
      - main
      - codex/1.3b

jobs:
  source-gate:
    name: Source gate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Test core and build Debug and Release apps
        run: zsh Scripts/check-1.3-mobile.sh --require-sdk

  ui-matrix:
    name: Launch and rotate (${{ matrix.device }})
    needs: source-gate
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - iPhone
          - iPad
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Choose a simulator
        id: simulator
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); prefix=sys.argv[1]; print(next(d["udid"] for values in data["devices"].values() for d in values if d["name"].startswith(prefix)))' '${{ matrix.device }}')"
          echo "id=$device_id" >> "$GITHUB_OUTPUT"

      - name: Run launch and rotation UI test
        run: |
          xcodebuild test \
            -project Apps/UltimateLemmingsIOS/UltimateLemmingsIOS.xcodeproj \
            -scheme UltimateLemmingsIOS \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO
