# Serve ACME challenges before the complete site is published.
server {
    listen 80;
    listen [::]:80;
    server_name lemmings.glasscode.academy;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
    access_log off;
    error_log /var/log/nginx/lemmings-error.log warn;
}
