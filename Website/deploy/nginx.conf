server {
    listen 80;
    listen [::]:80;
    server_name lemmings.glasscode.academy;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://lemmings.glasscode.academy$request_uri; }
    access_log off;
    error_log /var/log/nginx/lemmings-error.log warn;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lemmings.glasscode.academy;
    root /var/www/lemmings/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/lemmings.glasscode.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemmings.glasscode.academy/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    error_log /var/log/nginx/lemmings-error.log warn;
    autoindex off;
    gzip on;
    gzip_types text/css text/plain application/json application/xml image/svg+xml application/javascript;
    gzip_min_length 512;
    error_page 404 /404/index.html;
    error_page 500 502 503 504 /503/index.html;
    location = /404/index.html { internal; }
    location = /503/index.html { internal; }
    location ~ /\. { deny all; }
    location ~ ^(.+)/index\.html$ { return 308 https://lemmings.glasscode.academy$1$is_args$args; }
    location = /index.html { return 308 https://lemmings.glasscode.academy/$is_args$args; }
    location ~ ^(.+)/$ { return 308 https://lemmings.glasscode.academy$1$is_args$args; }
    location /assets/ { try_files $uri =404; expires 1d; }
    location = /build.json { try_files $uri =404; expires -1; }
    location = /deployment.json { try_files $uri =404; expires -1; }
    location / { try_files $uri $uri/index.html =404; }
}
